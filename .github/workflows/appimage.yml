name: Faith AppImage

on:
  workflow_call:
  workflow_dispatch:
  push:
    tags: ['v*', 'ui-v*']

permissions:
  contents: read

concurrency:
  group: appimage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  appimage:
    name: Linux x86_64 AppImage
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Build, bundle and smoke-test
        working-directory: faith-ui
        run: ./scripts/appimage.sh

      - name: Upload AppImage and SHA-256 checksum
        uses: actions/upload-artifact@v4
        with:
          name: Faith-x86_64-AppImage
          path: |
            faith-ui/dist/*.AppImage
            faith-ui/dist/*.sha256
          if-no-files-found: error
          compression-level: 0
