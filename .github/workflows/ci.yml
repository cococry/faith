name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-24.04
    
    defaults:
      run:
        working-directory: faith-ui

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-24.04
    
    defaults:
      run:
        working-directory: faith-ui
    
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            cmake \
            ninja-build \
            clang \
            libclang-dev \
            libx11-dev \
            libx11-xcb-dev \
            libxcb1-dev \
            libwayland-dev \
            libegl1-mesa-dev \
            libgl1-mesa-dev \
            libvulkan-dev \
            libfreetype6-dev \
            libfontconfig1-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: faith-ui

      - name: Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

  test:
    name: test
    runs-on: ubuntu-24.04

    defaults:
      run:
        working-directory: faith-ui
    
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            cmake \
            ninja-build \
            clang \
            libclang-dev \
            libx11-dev \
            libx11-xcb-dev \
            libxcb1-dev \
            libwayland-dev \
            libegl1-mesa-dev \
            libgl1-mesa-dev \
            libvulkan-dev \
            libfreetype6-dev \
            libfontconfig1-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: faith-ui

      - name: Check
        run: cargo check --locked --all-targets --all-features

      - name: Test
        run: cargo test --locked --all-targets --all-features --no-fail-fast

  docs:
    name: docs
    runs-on: ubuntu-24.04
    
    defaults:
      run:
        working-directory: faith-ui

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            cmake \
            ninja-build \
            clang \
            libclang-dev \
            libx11-dev \
            libx11-xcb-dev \
            libxcb1-dev \
            libwayland-dev \
            libegl1-mesa-dev \
            libgl1-mesa-dev \
            libvulkan-dev \
            libfreetype6-dev \
            libfontconfig1-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: faith-ui

      - name: Build docs
        run: cargo doc --locked --no-deps --all-features

  audit:
    name: dependency audit
    runs-on: ubuntu-24.04
    
    defaults:
      run:
        working-directory: faith-ui

    steps:
      - uses: actions/checkout@v4

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Audit dependencies
        run: cargo audit

  release-build:
    name: release build
    runs-on: ubuntu-24.04
    needs: [fmt, clippy, test, docs, audit]

    defaults:
      run:
        working-directory: faith-ui
        
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            cmake \
            ninja-build \
            clang \
            libclang-dev \
            libx11-dev \
            libx11-xcb-dev \
            libxcb1-dev \
            libwayland-dev \
            libegl1-mesa-dev \
            libgl1-mesa-dev \
            libvulkan-dev \
            libfreetype6-dev \
            libfontconfig1-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2  
        with:
          workspaces: faith-ui


      - name: Build release binary
        run: cargo build --locked --release

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: faith-linux-x86_64
          path: faith-ui/target/release/faith
