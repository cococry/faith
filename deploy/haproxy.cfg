global
    nbthread 1
    maxconn 2048

defaults
    mode tcp
    timeout connect 5s
    timeout client 10m
    timeout server 10m

resolvers docker
    nameserver dns 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s
    hold valid 1s
    hold obsolete 1s

frontend faith
    bind :4433
    default_backend faith_api

backend faith_api
    balance roundrobin
    server-template api 1-16 api:4433 check inter 5s resolvers docker init-addr none resolve-prefer ipv4
